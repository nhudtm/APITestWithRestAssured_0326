name: API Test Suite

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Run REST Assured tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build config.properties from GitHub Secrets
        env:
          BASE_URL: ${{ secrets.base_url }}
          USERNAME: ${{ secrets.username }}
          PASSWORD: ${{ secrets.password }}
        shell: bash
        run: |
          mkdir -p src/test/resources
          cat > src/test/resources/config.properties <<EOF
          base.url=$BASE_URL
          username=$USERNAME
          password=$PASSWORD
          EOF

      - name: Validate required secrets
        env:
          BASE_URL: ${{ secrets.base_url }}
          USERNAME: ${{ secrets.username }}
          PASSWORD: ${{ secrets.password }}
        shell: bash
        run: |
          test -n "$BASE_URL" || (echo "Missing base_url secret" && exit 1)
          test -n "$USERNAME" || (echo "Missing username secret" && exit 1)
          test -n "$PASSWORD" || (echo "Missing password secret" && exit 1)

      - name: Run default CRUD suite
        env:
          BASE_URL: ${{ secrets.base_url }}
          USERNAME: ${{ secrets.username }}
          PASSWORD: ${{ secrets.password }}
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Generate Allure report
        if: always()
        run: mvn --batch-mode --no-transfer-progress allure:report

      - name: Verify Allure report
        if: always()
        shell: bash
        run: |
          test -f target/site/allure-maven-plugin/index.html
          test -f target/site/allure-maven-plugin/widgets/summary.json
          cat target/site/allure-maven-plugin/widgets/summary.json

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-html-report
          path: target/site/allure-maven-plugin
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: target/site/allure-maven-plugin

  deploy-allure-pages:
    needs: test
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
